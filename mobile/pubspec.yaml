name: mobile
description: INCOGNITO employee reporting application
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.9.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.3.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.3.0
  crypto: ^3.0.6
  flutter_inappwebview: ^6.0.0
dependency_overrides:
  flutter_inappwebview_android:
    path: vendor/flutter_inappwebview_android
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/prover/prover.html
